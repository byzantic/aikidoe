# Regenerate every reference fixture with current R and Python packages and check the committed
# fixtures still agree (spec §13). Runs weekly, on demand, and on PRs that touch the generators.
name: fixtures
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/ref/**'
      - 'tests/fixtures/**'
      - 'tools/regen-fixtures.mjs'
      - 'tools/check-fixtures.mjs'
      - '.github/workflows/fixtures.yml'
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/ref/requirements.txt
      - run: pip install -r tests/ref/requirements.txt
      # apt mirrors on the runners can be unreachable for minutes (DNS failures for
      # azure.archive.ubuntu.com): retry each download, and time out a dead connection
      - name: Patient apt
        run: printf 'Acquire::Retries "6";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # binary packages from Posit Package Manager: fast installs
      - name: R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('tests/ref/r-packages.txt') }}
      - name: System libraries for R package binaries
        run: |   # igraph (needed by FrF2); three tries a minute apart
          for i in 1 2 3; do
            sudo apt-get install -y --no-install-recommends libglpk40 && exit 0
            echo "apt failed (attempt $i)"; sleep 60; sudo apt-get update || true
          done
          exit 1
      - run: Rscript tests/ref/install-r-packages.R
      - run: node tools/regen-fixtures.mjs --out .fixtures-fresh
      - run: node tools/check-fixtures.mjs --fresh .fixtures-fresh
      # A generator that needs packages unavailable locally can be run here first: any fixture
      # that is new (not committed yet) is printed gzip+base64 so it can be recovered from the log.
      - name: Print new fixtures
        if: always()
        run: |
          for f in .fixtures-fresh/*.json; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            [ -f "tests/fixtures/$b" ] && continue
            echo "BEGIN-FIXTURE $b"; gzip -9c "$f" | base64 -w0; echo; echo "END-FIXTURE $b"
          done
      - name: Keep the regenerated fixtures for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixtures-fresh
          path: .fixtures-fresh/
          if-no-files-found: ignore
