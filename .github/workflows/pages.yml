# Publish the browser UI with GitHub Pages on every push to main (and on demand).
# Published: the app (index.html, css/, ui/, js/, vendor/, examples/), the manual (docs/manual/,
# with /manual/ redirecting to it) and the JSON Schemas (schema/).
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Assemble the site
        run: |
          mkdir -p _site/docs _site/manual
          cp -r index.html css ui js vendor examples schema _site/
          cp -r docs/manual _site/docs/
          printf '<!doctype html><meta charset="utf-8"><title>aikidoe manual</title><meta http-equiv="refresh" content="0; url=../docs/manual/"><a href="../docs/manual/">aikidoe manual</a>\n' > _site/manual/index.html
          cp LICENSE _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
